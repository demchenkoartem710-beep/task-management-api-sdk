
name: Deploy Zudoku to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose repository
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Searching for package.json:"
          find . -maxdepth 4 -name package.json -not -path "*/node_modules/*"

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/my-app"
          npm install --no-audit --no-fund

      - name: Build Zudoku
        run: |
          cd "$GITHUB_WORKSPACE/my-app"
          npm run build

      - name: Verify build
        run: |
          ls -la "$GITHUB_WORKSPACE/my-app/dist"
          test -f "$GITHUB_WORKSPACE/my-app/dist/index.html"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


