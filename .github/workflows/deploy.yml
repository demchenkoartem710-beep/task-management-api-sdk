
name: Deploy Zudoku to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        working-directory: my-app
        run: |
          pwd
          ls -la
          test -f package.json || (echo "ERROR: package.json not found in my-app" && exit 1)

      - name: Install dependencies
        working-directory: my-app
        run: npm install --no-audit --no-fund

      - name: Build Zudoku
        working-directory: my-app
        run: npm run build

      - name: Verify build output
        run: |
          test -f my-app/dist/index.html || (echo "ERROR: my-app/dist/index.html not found" && exit 1)
          echo "Build output verified."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


